name: Main project workflow
on:
  # Build on demand:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker images tag'
        required: true
  push:
    # Sequence of patterns matched against refs/heads
    branches:
    # Push events on master branch
    - master
    # Sequence of patterns matched against refs/tags
    tags:
    - v*.*.*             # Push events to vx.y.z

  pull_request:
    branches:
    - master

  # Publish `vx.y.z` tags as releases:
  #release:
  #  types: [published]

jobs:
  format_style:
    name: Check source code format
    runs-on: ubuntu-latest
    steps:
    -
      name: Check out the repo
      uses: actions/checkout@v2
    -
      name: Run frankwolf format
      run: |
          sources=$(find . -name "*.hpp" -o -name "*.cpp")
          #docker run -i --rm -v $PWD:/data frankwolf/astyle ${sources}
          #git diff --exit-code
          # docker cannot write on host directory:
          ! docker run -i --rm -v $PWD:/data frankwolf/astyle --dry-run ${sources} | grep ^Formatted

  # Doxygen html for the GitHub Pages site (doxygen/), formerly served by codedocs.xyz
  doxygen:
    uses: testillano/workflows/.github/workflows/doxygen.yml@v1
    with:
      doxyfile_dir: docs/doxygen
      doxyfile_overrides: |
        PROJECT_NUMBER=${{ github.ref_name }}

  # Deploy the Pages site in a dedicated job on a clean runner: actions/deploy-pages@v4
  # requires the 'github-pages' environment to be declared on the job.
  deploy_pages:
    needs: doxygen
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    # Do not fail the whole pipeline if Pages hiccups:
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    -
      name: Setup Pages
      uses: actions/configure-pages@v3
    -
      name: Download doxygen html
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.doxygen.outputs.artifact_name }}
        path: site/doxygen
    -
      name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site
    -
      name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
